<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VENTAX</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="gate" class="gate hidden"></div>

<div class="app hidden" id="app">
  <aside class="side">
    <div class="logo"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#ffc933"/><path d="M6 7l6 11 6-11" fill="none" stroke="#2a2f3a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Ventax</span></div>
    <nav id="tabs">
      <div class="grp">Operación</div>
      <button data-tab="venta" class="on"><svg class="ic" viewBox="0 0 24 24"><path d="M3 4h2l2.4 11h10.2L20 7H6"/><circle cx="9" cy="19" r="1.3"/><circle cx="17" cy="19" r="1.3"/></svg>Cobro</button>
      <button data-tab="turno"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Turnos</button>
      <div class="grp">Inventario</div>
      <button data-tab="alertas"><svg class="ic" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/></svg>Alertas <span id="alertCount" class="count hidden"></span></button>
      <button data-tab="inventario"><svg class="ic" viewBox="0 0 24 24"><path d="M4 8l8-4 8 4v8l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v8"/></svg>Catálogo</button>
      <div class="grp" data-perm="reportes">Gestión</div>
      <button data-tab="reportes" data-perm="reportes"><svg class="ic" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7M9 8h3"/></svg>Reportes</button>
      <button data-tab="dashboard" data-perm="reportes"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg>Dashboard</button>
      <button data-tab="asistente" data-perm="reportes"><svg class="ic" viewBox="0 0 24 24"><path d="M5 5h14v10H10l-5 4z"/></svg>Asistente IA</button>
      <div class="grp" data-perm="empleados">Sistema</div>
      <button data-tab="equipo" data-perm="empleados"><svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 11a3 3 0 100-6M18 14c2 .6 3 2.4 3 5"/></svg>Equipo</button>
      <button data-tab="config" data-perm="ajustes"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>Ajustes</button>
    </nav>
    <div class="biz muted" id="biz"></div>
  </aside>

  <div class="content">
    <header class="top">
      <input id="scan" class="scan" placeholder="Escanear código o buscar producto…" autocomplete="off" aria-label="Escanear código o buscar producto">
      <span id="clock" class="chip plain"></span><span id="shiftBadge" class="chip"></span>
      <span id="netBadge" class="chip ok">Online</span>
      <button id="helpBtn" class="ghost" title="Ver el recorrido de ayuda">Guía</button>
      <button id="userBtn" class="userbtn" title="Bloquear sesión"><span id="userName"></span></button>
      <button id="logoutBtn" class="ghost" title="Cerrar sesión">Salir</button>
      <button id="themeBtn" class="ghost" title="Modo claro/oscuro">◐</button>
    </header>

    <main>
      <div id="banner" class="banner hidden"></div>
      <div class="titlerow"><h1 id="pageTitle">Cobro</h1><p id="pageSub" class="muted"></p></div>

      <section id="tab-venta" class="tab">
        <div class="pos">
          <div class="catalog">
            <div class="cats" id="cats"></div>
            <div id="results" class="results"></div>
          </div>
          <aside class="ticket-panel">
            <div class="tp-head"><div><b id="ticketNo">TICKET</b><small>Cajero: <span id="ticketWho"></span></small></div><button id="clearBtn" class="ghost">Vaciar</button></div>
            <div class="cart" id="cart"></div>
            <div class="sums" id="sums"></div>
            <div class="totalbar"><div class="muted"><span id="count">0</span> artículos</div><div class="total" id="total">$0.00</div></div>
            <div class="payquick"><button data-m="efectivo">Efectivo</button><button data-m="tarjeta">Tarjeta</button><button data-m="transferencia">Transferencia</button></div>
            <button id="payBtn" class="primary big">COBRAR (F9)</button>
            <div class="row"><button id="discBtn" class="ghost grow">Descuento</button><button id="retBtn" class="ghost grow">Devolución</button></div>
          </aside>
        </div>
      </section>

      <section id="tab-inventario" class="tab hidden">
        <div class="bar">
          <input id="invSearch" placeholder="Buscar producto, código o categoría…">
          <button id="importBtn" data-need="importar">Importar CSV</button>
          <button id="newProd" class="primary" data-need="productos">+ Nuevo producto</button>
        </div>
        <div class="grid2">
          <form id="stockForm" class="card form" data-need="productos">
            <h3 style="margin:0">Entrada / salida de almacén</h3>
            <input name="barcode" placeholder="Escanea código de barras" required>
            <select name="type">
              <option value="entrada">Entrada (compra / reabasto)</option>
              <option value="merma">Merma / caducidad</option>
              <option value="devolucion_proveedor">Devolución a proveedor</option>
              <option value="devolucion_cliente">Devolución de cliente</option>
              <option value="ajuste">Ajuste (+/−)</option>
            </select>
            <input name="qty" type="number" step="any" placeholder="Cantidad" required>
            <input name="cost" type="number" step="0.01" min="0" placeholder="Costo de compra (opcional, actualiza el costo)">
            <input name="note" placeholder="Nota (opcional)">
            <button class="primary">Registrar</button>
            <div id="stockMsg" class="muted"></div>
          </form>
          <div class="tablewrap"><table id="prodTable"></table></div>
        </div>
      </section>

      <section id="tab-turno" class="tab hidden"><div id="turnoBody"></div></section>
      <section id="tab-alertas" class="tab hidden"><div id="alertBody"></div></section>
      <section id="tab-reportes" class="tab hidden"><div id="repBody"></div></section>
      <section id="tab-dashboard" class="tab hidden"><div id="dashBody"></div></section>
      <section id="tab-asistente" class="tab hidden">
        <div class="chat">
          <div id="chatLog" class="chatlog"></div>
          <div class="chips" id="chips"></div>
          <form id="chatForm" class="row"><input id="chatInput" placeholder="Pregunta sobre tu negocio…" autocomplete="off"><button class="primary">Enviar</button></form>
        </div>
      </section>
      <section id="tab-equipo" class="tab hidden"><div id="teamBody"></div></section>
      <section id="tab-config" class="tab hidden"><div id="cfgBody"></div></section>
    </main>
  </div>
</div>

<dialog id="dlg"></dialog>
<dialog id="pinDlg"></dialog>
<div id="toast" class="toast hidden"></div>
<div id="ticketPrint"></div>
<script src="app.js" type="module"></script>
</body>
</html>
